<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Krishna ❤️ Jesu Music</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>🎵 My Music</h2>

    <div class="menu">
      <div>Home</div>
      <div>Search</div>
      <div>Library</div>
    </div>

    <div class="playlists">
      <p>PLAYLISTS</p>
      <div>❤️ Love Mix</div>
      <div>🌙 Chill</div>
      <div>🔥 Favorites</div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="header">
      <h1>Krishna ❤️ Jesu</h1>
      <p>Your personal music space</p>
    </div>

    <!-- 9 ALBUM COVERS -->
    <div class="albums">

      <div class="album" style="background-image:url('img1.jpg')">Mix 1</div>
      <div class="album" style="background-image:url('img2.jpg')">Mix 2</div>
      <div class="album" style="background-image:url('img3.jpg')">Mix 3</div>
      <div class="album" style="background-image:url('img4.jpg')">Mix 4</div>
      <div class="album" style="background-image:url('img5.jpg')">Mix 5</div>
      <div class="album" style="background-image:url('img6.jpg')">Mix 6</div>
      <div class="album" style="background-image:url('img7.jpg')">Mix 7</div>
      <div class="album" style="background-image:url('img8.jpg')">Mix 8</div>
      <div class="album" style="background-image:url('img9.jpg')">Mix 9</div>

    </div>

    <!-- SONG LIST (ONLY 1 SONG) -->
    <div class="songs">
      <h3>Song</h3>

      <div class="song" onclick="playSong('Those_Eyes_-_New_West_(mp3.pm).mp3','Those Eyes - New West')">
        💖 Those Eyes - New West
      </div>

    </div>

  </div>
</div>

<!-- PLAYER -->
<div class="player">
  <audio id="audio" controls></audio>
  <div id="nowPlaying">Nothing playing</div>
</div>

<script src="script.js"></script>
</body>
    </html>
